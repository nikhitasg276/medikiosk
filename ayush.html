    <style>

        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            margin-top: 20px;
        }

        .option-btn {
            display: block;
            width: 90%;
            margin: 12px auto;
            padding: 15px;
            font-size: 17px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: #f8f8f8;
            color: #222;
            cursor: pointer;
        }

        .option-btn:hover {
            transform: scale(1.02);
            background: #eeeeee;
        }

        #question {
            font-size: 21px;
        }

        #answer {
            width: 90%;
            padding: 14px;
            font-size: 17px;
            border-radius: 10px;
            border: 1px solid #ccc;
            color: #222;
            background: white;
        }

        .hidden {
            display: none;
        }

        .summary {
            text-align: left;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .status {
            font-weight: bold;
            margin: 15px;
        }

        .selected-system {
            background: #f1f8e9;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

    </style>

</head>

<div class="home-container">

    <h1 id="title">
        AYUSH History

    <p id="subtitle">
        Let's record your AYUSH-related health history

             STEP 1 : AYUSH SYSTEM
        ========================================== -->

            </button>

                class="option-btn"
                id="yogaBtn"

                🧘 Yoga & Naturopathy

            </button>


            <button

                🌙 Unani

            </button>


            <button
                class="option-btn"
                id="siddhaBtn"

                🌱 Siddha

            </button>


            <button
                class="option-btn"
                id="homeopathyBtn"

            <button
                class="option-btn"

                ❓ I'm not sure

        </div>



        <!-- =========================================
             STEP 2 : QUESTIONS
        ========================================== -->

        <div id="questionCard"
             class="card hidden">


            <div class="selected-system">

            </div>


            <h2 id="question"></h2>


            <input

                id="answer"
                placeholder="Type your answer..."
            >


            <br><br>


            <button
                onclick="startVoice()"
                id="voiceBtn">

                🎤 Speak Answer

            </button>


            <button
                onclick="speakQuestion()"
                id="speakBtn">

                🔊 Hear Question

            </button>


            <button
                onclick="nextQuestion()"
                id="nextBtn">

                ➡️ Next

            </button>


            <div
                id="status"
                class="status">
            </div>


            <p id="progress"></p>

        </div>



        <!-- =========================================
             FINAL SUMMARY
        ========================================== -->

        <div id="summaryBox"></div>


        <br>


        <button
            onclick="goBack()"
            id="backBtn">

            ⬅️ Back to Dashboard

        </button>


    </div>

</div>

/* =====================================================
   SELECT AYUSH SYSTEM
===================================================== */

function selectSystem(system) {

    selectedSystem = system;

    currentQuestion = 0;

    answers = [];


    document.getElementById("systemCard")
        .classList.add("hidden");


    document.getElementById("questionCard")
        .classList.remove("hidden");


    document.getElementById("selectedSystem")
        .innerText =
        getSystemDisplayName(system);


    showQuestion();


    setTimeout(function() {

        speakQuestion();

    }, 500);

}



/* =====================================================
   GET CURRENT QUESTIONS
===================================================== */

function getQuestions() {

    const languageQuestions =
        questions[language] || questions.en;


    return languageQuestions[selectedSystem];

}



/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    const list =
        getQuestions();


    if (!list ||
        currentQuestion >= list.length) {

        finishHistory();

        return;

    }


    document.getElementById("question")
        .innerText =
        list[currentQuestion];


    document.getElementById("answer")
        .value = "";


    document.getElementById("progress")
        .innerText =
        `${currentQuestion + 1} / ${list.length}`;


    document.getElementById("status")
        .innerText = "";

}



/* =====================================================
   SPEAK QUESTION
===================================================== */

function speakQuestion() {

    const list =
        getQuestions();


    if (!list) return;


    const speech =
        new SpeechSynthesisUtterance(
            list[currentQuestion]
        );


    const voiceLanguage = {

        en: "en-IN",

        kn: "kn-IN",

        hi: "hi-IN"

    };


    speech.lang =
        voiceLanguage[language] || "en-IN";


    speech.rate = 0.9;


    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        speech
    );

}



/* =====================================================
   VOICE INPUT
===================================================== */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Recognition) {

        alert(
            "Voice recognition is not supported. Please use Google Chrome."
        );

        return;

    }


    const recognition =
        new Recognition();


    const voiceLanguage = {

        en: "en-IN",

        kn: "kn-IN",

        hi: "hi-IN"

    };


    recognition.lang =
        voiceLanguage[language] || "en-IN";


    recognition.continuous = false;

    recognition.interimResults = false;


    document.getElementById("status")
        .innerText =
        t.listening;


    recognition.start();


    recognition.onresult =
        function(event) {

            const result =
                event.results[0][0]
                    .transcript;


            document.getElementById("answer")
                .value = result;


            document.getElementById("status")
                .innerText =
                t.captured;

        };


    recognition.onerror =
        function() {

            document.getElementById("status")
                .innerText =
                "❌ Please try again.";

        };

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    const answer =
        document.getElementById("answer")
            .value
            .trim();


    if (!answer) {

        alert(t.empty);

        return;

    }


    const list =
        getQuestions();


    answers.push({

        question:
            list[currentQuestion],

        answer:
            answer

    });


    currentQuestion++;


    showQuestion();

}



/* =====================================================
   SAVE AYUSH HISTORY
===================================================== */

function finishHistory() {

    const patientData = {

        username:
            loggedInUser,

        type:
            "AYUSH",

        system:
            selectedSystem,

        systemDisplay:
            getSystemDisplayName(
                selectedSystem
            ),

        language:
            language,

        date:
            new Date()
                .toLocaleString(),

        answers:
            answers

    };


    let history = [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "ayushHistory"
                ) || "[]"
            );

    }

    catch(error) {

        console.error(
            "AYUSH history error:",
            error
        );

        history = [];

    }


    history.push(patientData);


    localStorage.setItem(
        "ayushHistory",
        JSON.stringify(history)
    );


    document.getElementById("questionCard")
        .classList.add("hidden");


    document.getElementById("summaryBox")
        .innerHTML = `

        <div class="summary">

            <h2>
                🌿 ${t.completed}
            </h2>


            <p>

                <strong>
                    ${t.systemLabel}:
                </strong>

                ${escapeHTML(
                    getSystemDisplayName(
                        selectedSystem
                    )
                )}

            </p>


            <p>

                👤
                ${escapeHTML(
                    loggedInUser
                )}

            </p>


            <hr>


            ${answers.map(
                function(item) {

                    return `

                        <p>

                            <strong>
                                ${escapeHTML(
                                    item.question
                                )}
                            </strong>

                            <br>

                            ${escapeHTML(
                                item.answer
                            )}

                        </p>

                    `;

                }
            ).join("")}


            <p>
                ✅ ${t.saved}
            </p>

        </div>

    `;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
