<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Language - MediKiosk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="home-container">

        <div class="logo">🌐</div>

        <h1>Choose Your Language</h1>

        <p>
            ನಿಮ್ಮ ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ / Select your preferred language
        </p>

        <button onclick="selectLanguage('Kannada')">
            ಕನ್ನಡ
        </button>

        <br><br>

        <button onclick="selectLanguage('English')">
            English
        </button>

        <br><br>

        <button onclick="selectLanguage('Hindi')">
            हिंदी
        </button>

    </div>

    <script>
        function selectLanguage(language) {

            if (language === "Kannada") {
                window.location.href = "role.html?lang=kn";
            }

            else if (language === "English") {
                window.location.href = "role.html?lang=en";
            }

            else if (language === "Hindi") {
                window.location.href = "role.html?lang=hi";
            }

        }
    </script>

</body>
</html>
